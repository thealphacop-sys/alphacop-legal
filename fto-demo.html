<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FTO Tracker Demo by Alpha Cop</title>
<style>
:root{--bg:#0E1320;--panel:#18202F;--field:#0F1420;--line:#2B3447;--text:#E8ECF3;--muted:#9AA4B7;--accent:#5B8CFF;--accent-t:#FFFFFF;--redbg:#4A1D22;--redt:#FF7A7A;--greenbg:#173B2A;--greent:#4ADE80;--greybg:#2A3142;--greyt:#B4BCCB;--btnline:#3A4459}
[data-theme="light"]{--bg:#F3F5F9;--panel:#FFFFFF;--field:#F7F8FB;--line:#D9DEE7;--text:#151A24;--muted:#5D6678;--accent:#2F6BFF;--redbg:#FDE4E4;--redt:#B42318;--greenbg:#DDF5E7;--greent:#137A3D;--greybg:#E9ECF2;--greyt:#4A5263;--btnline:#C9D0DC}
@media (prefers-color-scheme: light){[data-theme="auto"]{--bg:#F3F5F9;--panel:#FFFFFF;--field:#F7F8FB;--line:#D9DEE7;--text:#151A24;--muted:#5D6678;--accent:#2F6BFF;--redbg:#FDE4E4;--redt:#B42318;--greenbg:#DDF5E7;--greent:#137A3D;--greybg:#E9ECF2;--greyt:#4A5263;--btnline:#C9D0DC}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.wrap{max-width:760px;margin:0 auto;padding-bottom:240px}
header.app{display:flex;align-items:center;gap:14px;padding:16px 18px;background:var(--panel);border-bottom:1px solid var(--line)}
header.app .badge{width:52px;height:60px;flex:none}
header.app .ttl{flex:1;min-width:0}
header.app h1{margin:0;font-size:20px;font-weight:700;line-height:1.2}
header.app .who{font-size:14px;color:var(--muted);margin-top:2px;line-height:1.35}
.hbtn{background:transparent;border:1px solid var(--btnline);border-radius:10px;padding:8px 12px;font-size:14px;min-height:44px}
.navrow{display:flex;gap:8px;overflow-x:auto;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--panel);scrollbar-width:none;align-items:center}
.navrow::-webkit-scrollbar{display:none}
.navrow .lbl{font-size:12px;font-weight:800;letter-spacing:1px;color:var(--muted);flex:none;margin-right:2px}
.pill{flex:none;background:transparent;border:1px solid var(--btnline);border-radius:999px;padding:9px 16px;font-size:15px;min-height:42px;white-space:nowrap}
.pill.on{background:var(--accent);border-color:var(--accent);color:var(--accent-t)}
main{padding:16px}
h2{font-size:20px;margin:22px 0 12px;font-weight:700}
h2:first-child{margin-top:4px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:14px}
.card h3{margin:0 0 12px;font-size:18px}
.muted{color:var(--muted)}
.small{font-size:14px;line-height:1.45}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:6px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px 18px}
.stat b{display:block;font-size:30px;font-weight:800;line-height:1.1}
.stat span{font-size:14px;color:var(--muted)}
.li{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.li:first-child{border-top:0;padding-top:0}
.li:last-child{padding-bottom:0}
.li .g{flex:1;min-width:0}
.li .t{font-size:16px}
.li .s{font-size:13px;color:var(--muted);margin-top:2px;line-height:1.4}
.btn{background:transparent;border:1px solid var(--btnline);border-radius:10px;padding:9px 14px;font-size:15px;min-height:44px;white-space:nowrap}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.sm{min-height:38px;padding:6px 12px;font-size:14px}
.btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
.tblwrap{overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:6px 14px}
table{border-collapse:collapse;width:100%;font-size:15px}
th{color:var(--muted);font-weight:600;text-align:left;padding:12px 10px;white-space:nowrap;border-bottom:1px solid var(--line)}
td{padding:12px 10px;border-bottom:1px solid var(--line);vertical-align:top;white-space:nowrap}
tr:last-child td{border-bottom:0}
td.today,th.today{outline:2px solid var(--accent);outline-offset:-2px;border-radius:6px}
.cnt{display:inline-grid;place-items:center;min-width:30px;height:28px;padding:0 8px;border-radius:999px;font-weight:700;font-size:14px}
.cnt.red{background:var(--redbg);color:var(--redt)}
.cnt.zero{background:var(--greenbg);color:var(--greent)}
.tag{display:inline-block;font-size:12px;font-weight:800;padding:4px 10px;border-radius:999px;margin:4px 4px 0 0;letter-spacing:.4px}
.tag.red{background:var(--redbg);color:var(--redt)}
.tag.green{background:var(--greenbg);color:var(--greent)}
.tag.grey{background:var(--greybg);color:var(--greyt)}
.cell .sh{font-size:14px}
.cell .ft{font-size:13px;color:var(--muted)}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px;min-width:0}
.field label{font-size:14px;color:var(--muted)}
.field input,.field select,.field textarea{background:var(--field);border:1px solid var(--line);border-radius:10px;padding:11px 12px;min-height:46px;width:100%}
.field textarea{min-height:150px;resize:vertical;line-height:1.45}
.field input[readonly]{opacity:.9}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.checks{display:flex;flex-wrap:wrap;gap:10px}
.chk{display:flex;align-items:center;gap:8px;font-size:15px;border:1px solid var(--line);border-radius:10px;padding:8px 12px;background:var(--field)}
.chk input{width:18px;height:18px;accent-color:var(--accent)}
.grp{font-size:13px;font-weight:800;letter-spacing:1px;color:var(--muted);margin:18px 0 4px}
.dorrow{display:grid;grid-template-columns:1fr 104px 74px;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.dorrow span{font-size:15px;line-height:1.35}
.dorrow select,.dorrow input{background:var(--field);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-height:44px;width:100%}
details.sec{border-bottom:1px solid var(--line)}
details.sec summary{list-style:none;cursor:pointer;padding:12px 0;font-weight:700;font-size:16px}
details.sec summary::-webkit-details-marker{display:none}
details.sec summary::before{content:"▶ ";font-size:13px}
details.sec[open] summary::before{content:"▼ "}
details.sec summary .muted{font-weight:600}
.ckrow{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;padding:10px 0;border-top:1px solid var(--line);font-size:15px}
.ckbtn{background:transparent;border:1px solid var(--btnline);border-radius:10px;padding:6px 10px;min-height:42px;min-width:96px;font-size:14px;line-height:1.15}
.ckbtn.f{border-color:var(--accent);color:var(--accent)}
.ckbtn.ft{background:var(--greenbg);border-color:var(--greent);color:var(--greent)}
.ckbtn small{display:block;font-size:11px;opacity:.85}
.bar{height:10px;background:var(--greybg);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:6px}
.sigline{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line);font-size:15px}
.sigline:first-of-type{border-top:0}
.stamp{color:var(--greent);font-size:13px;font-weight:700;text-align:right}
.tour{position:fixed;left:50%;transform:translateX(-50%);bottom:14px;width:calc(100% - 20px);max-width:520px;background:#0D1B45;color:#fff;border:1.5px solid #5B8CFF;border-radius:18px;padding:14px 16px;z-index:40;box-shadow:0 20px 50px rgba(0,0,0,.55)}
.tour .step{font-size:11px;font-weight:800;letter-spacing:1.8px;color:#9DB8FF}
.tour h4{margin:4px 0;font-size:17px}
.tour p{margin:0;font-size:14px;line-height:1.45;color:#DCE4F7}
.tour .acts{display:flex;justify-content:space-between;align-items:center;margin-top:12px}
.tour .dots{display:flex;gap:5px}.tour .dots i{width:7px;height:7px;border-radius:50%;background:#34477F}.tour .dots i.on{background:#9DB8FF}
.tour .x{position:absolute;top:6px;right:6px;background:none;border:0;color:#9DB8FF;width:40px;height:40px;font-size:22px}
.tour .tb{border-radius:10px;padding:8px 16px;min-height:42px;font-weight:700;border:1px solid #4A5E99;background:transparent;color:#fff}
.tour .tb.n{background:#5B8CFF;border-color:#5B8CFF}
.tourpill{position:fixed;bottom:16px;right:16px;background:#5B8CFF;color:#fff;border:0;border-radius:999px;padding:11px 18px;font-weight:700;font-size:14px;z-index:40;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.welcome{max-width:520px;margin:0 auto;padding:44px 22px 60px;text-align:center}
.welcome img{width:92px;height:92px;border-radius:20px}
.welcome h1{font-size:34px;margin:18px 0 8px;line-height:1.1}
.welcome p{color:var(--muted);font-size:16px;line-height:1.5;margin:0 0 22px}
.welcome .btn{width:100%;margin-bottom:10px;min-height:50px;font-size:16px;font-weight:600}
.cta{background:#B3261E;color:#fff;border-radius:16px;padding:18px;margin-top:6px;text-align:left}
.cta b{font-size:20px;display:block}
.cta p{color:#fff;margin:6px 0 8px;font-size:15px}
.cta a{color:#fff;font-weight:700}
.feat{display:flex;gap:10px;text-align:left;padding:7px 0;font-size:15px}
.feat::before{content:"✓";color:var(--accent);font-weight:800}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:60;display:none;align-items:center;justify-content:center;padding:16px}
.modal.open{display:flex}
.modal .card{max-width:520px;width:100%;max-height:85vh;overflow:auto;margin:0}
.email{background:#fff;color:#1A1D24;border-radius:12px;padding:16px;font-size:14px;line-height:1.5}
.email .hd{font-size:13px;color:#5A6170;border-bottom:1px solid #E1E4EA;padding-bottom:8px;margin-bottom:10px}
.toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);background:#4ADE80;color:#062312;font-weight:700;font-size:15px;padding:11px 16px;border-radius:12px;z-index:80;opacity:0;transition:opacity .25s;pointer-events:none;max-width:90%;text-align:center}
.toast.show{opacity:1}
.demo-strip{background:#B3261E;color:#fff;text-align:center;font-size:12px;font-weight:700;letter-spacing:.6px;padding:6px 10px}
.flash{animation:fl 1.8s ease}
@keyframes fl{0%{box-shadow:0 0 0 3px #5B8CFF}100%{box-shadow:0 0 0 0 transparent}}
@media (max-width:520px){.g2{grid-template-columns:1fr 1fr}.dorrow{grid-template-columns:1fr 96px 66px}.ckrow{grid-template-columns:1fr}.ckrow .bb{display:flex;gap:8px}.ckbtn{flex:1}}
</style>
</head>

<div id="tour"></div>
<div class="modal" id="modal" role="dialog" aria-modal="true"><div class="card" id="modalBody"></div></div>
<div class="toast" id="toast" role="status"></div>

/* ---------- derived ---------- */
function reportStatus(s,r){

if(r==='End of Phase'){if(s.eop)return 'green';return s.off<0?'red':'grey';}
return 'grey';
}

}

<div class="field"><label for="pName">Name</label><input id="pName" placeholder="First Last"></div><div class="field"><label for="pBadge">Badge</label><input id="pBadge" inputmode="numeric"></div></div>
<div class="field"><label for="pEmail">Email</label><input id="pEmail" type="email"></div><button class="btn primary" type="submit">Add</button></form>
<div class="card"><h3>Import a roster (CSV)</h3><p class="small muted">First row must be a header: Role, Rank, Name, Badge, Email. Role values: Administrator, Field Training Coordinator, FTO Supervisor, FTO, Trainee. Each person signs in with the temporary password above and is made to choose their own.</p><div class="field" style="margin:0"><input type="file" id="csv" accept=".csv,text/csv" aria-label="Roster CSV file"></div></div>
<h2>Roster (${state.roster.length})</h2><div class="tblwrap"><table><thead><tr><th>Name</th><th>Role</th><th>Badge</th><th>Email</th></tr></thead><tbody>${state.roster.map(r=>`<tr><td>${esc(r[1]+' '+r[2])}</td><td>${esc(r[0])}</td><td>${esc(r[3])}</td><td class="muted">${esc(r[4])}</td></tr>`).join('')}</tbody></table></div>`;

V.archive=()=>`<div class="card"><h3>Archived trainees</h3><p class="small muted">When a trainee graduates, archive them. Their complete file stays on record and can be exported any time.</p>
<div class="li"><div class="g"><div class="t">Casey Morales</div><div class="s">Graduated ${f(-96,{month:'short',day:'numeric',year:'numeric'})} · 12 weeks · 58 DORs · 11 weeklies · checklist complete</div></div><button class="btn sm" data-act="pdf">Export file</button></div>
<div class="li"><div class="g"><div class="t">Taylor Nguyen</div><div class="s">Graduated ${f(-210,{month:'short',day:'numeric',year:'numeric'})} · 13 weeks · 61 DORs · 12 weeklies · checklist complete</div></div><button class="btn sm" data-act="pdf">Export file</button></div></div>`;

V.backups=()=>`<div class="card"><h3>Backups</h3><p class="small muted">A full backup of every report, signature and schedule is taken automatically every night.</p>
${[0,1,2,3,4].map(o=>`<div class="li"><div class="g"><div class="t">${f(-o,{weekday:'short',month:'short',day:'numeric',year:'numeric'})} · 2:00 AM</div><div class="s">Automatic nightly backup</div></div><button class="btn sm" data-act="pdf">Download</button></div>`).join('')}
<div class="btns" style="margin-top:14px"><button class="btn primary" data-act="backup">Back up now</button></div></div>`;

V.audit=()=>`<div class="card"><h3>Audit log</h3><p class="small muted">Every submission, signature, edit and sign-in is recorded with who did it and when.</p>
${state.audit.map(a=>`<div class="li"><div class="g"><div class="t">${esc(a[2])}</div><div class="s">${esc(a[1])} · ${esc(a[0])}</div></div></div>`).join('')}</div>`;

V.end=()=>`<div class="welcome"><img src="${LOGO}" alt="Alpha Cop logo"><h1>That's FTO Tracker</h1>
<div class="card" style="text-align:left">${['Schedule with required reports built into every shift','Daily Observation Reports from any phone or MDT','Weekly evaluations with the week\'s DORs summarized','Full training checklist with FTO and trainee sign-off','Signatures, missing-report tracking and FTO notes','Weekly email reminders, analytics, audit log and nightly backups','Cloud-hosted, nothing to install','Built by an FTO Supervisor'].map(x=>`<div class="feat">${x}</div>`).join('')}</div>
<div class="cta"><b>Free pilot for 2 departments</b><p>Run your next FTO cycle on FTO Tracker at no cost. All we ask is honest feedback.</p><div>Contact Alpha Cop: <a href="https://alphacop.us">alphacop.us</a></div></div>
<div class="g2" style="margin-top:14px"><button class="btn" data-act="startTour">Replay tour</button><button class="btn" data-act="explore">Explore</button></div></div>`;

/* ---------- tour ---------- */
const TOUR=[
{v:'dashboard',a:'a-stats',t:'Dashboard',p:'Everything that needs attention when you sign in: trainees, shifts this week, reports waiting on your signature and anything due or missing.'},
{v:'dashboard',a:'a-progress',t:'Trainee progress',p:'Every trainee\'s week, overall average, last 3 shifts and a count of missing reports. A missing report can\'t hide.'},
{v:'schedule',a:'a-grid',t:'Schedule',p:'Shifts with the FTO and required reports. Grey = not due yet, green ✓ = on file, red = missing. Add a shift below and it shows up instantly.'},
{v:'daily',t:'Daily Observation Report',p:'Phase, week and shift fill in from the schedule. The FTO rates each category 1–5, N.O. or N.R.T., logs remedial minutes and signs. Try submitting one.'},
{v:'report',a:'a-sigblock',t:'Signatures',p:'Each report collects the FTO, trainee and supervisor signatures. Tap Sign to sign as the supervisor and it clears from your list.'},
{v:'weekly',t:'Weekly Evaluation',p:'Pick the week and the trainee\'s DORs for that week are pulled in, with their strongest and weakest areas, before you write the evaluation.'},
{v:'checklist',t:'Training checklist',p:'The full field training checklist. The FTO taps Trained or Performed, it\'s stamped with badge and date, and the trainee confirms.'},
{v:'roster',t:'Admin',p:'Add people one at a time or import a CSV roster. Analytics, archive of graduates, nightly backups and a full audit log are all here too.'},
{v:'dashboard',a:'a-remind',t:'Weekly reminders',p:'Every Sunday, anyone with open reports or signatures gets one email listing them. Tap "Send reminders now" to see the email.'},
{v:'end',t:'That\'s the tour',p:'Want to run your next FTO cycle on it for free?'}
];
function tourHtml(){
if(state.view==='welcome')return '';
if(!state.tourOn)return '<button class="tourpill" data-act="resumeTour">Guided tour</button>';
const s=TOUR[state.tourStep],i=state.tourStep,last=i===TOUR.length-1;
return `<div class="tour" role="region" aria-label="Guided tour"><button class="x" data-act="hideTour" aria-label="Close tour">×</button><div class="step">STEP ${i+1} OF ${TOUR.length}</div><h4>${s.t}</h4><p>${s.p}</p><div class="acts"><div class="dots">${TOUR.map((_,j)=>`<i class="${j===i?'on':''}"></i>`).join('')}</div><div style="display:flex;gap:8px">${i>0?'<button class="tb" data-act="prev">Back</button>':''}<button class="tb n" data-act="${last?'hideTour':'next'}">${last?'Done':'Next'}</button></div></div></div>`;
}
function setStep(i){
state.tourStep=i;state.tourOn=true;const s=TOUR[i];
if(s.v==='report'){const a=awaiting();state.reportId=(a[0]||{}).id||Object.keys(state.dors)[0];}
state.view=s.v;render();
if(s.a){const el=document.getElementById(s.a);if(el)el.scrollIntoView({behavior:'smooth',block:'start'});}else window.scrollTo(0,0);
}

/* ---------- render ---------- */
function render(){
document.body.dataset.theme=state.theme;
const bare=state.view==='welcome'||state.view==='end';
$('#root').innerHTML=bare?V[state.view]():shell(V[state.view]());
$('#tour').innerHTML=tourHtml();
bind();
}
function go(v){state.view=v;window.scrollTo(0,0);render();}
let tt;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),2200);}
function modal(html){$('#modalBody').innerHTML=html;$('#modal').classList.add('open');}

function bind(){
const as=$('#addShifts');
if(as)as.addEventListener('submit',e=>{e.preventDefault();
const tr=$('#asTr').value,fto=$('#asFto').value;if(!fto){toast('Choose an FTO');return;}
const off=+$('#asDate').value;const reps=[...as.querySelectorAll('input[type=checkbox]:checked')].map(c=>c.value);
const old=state.shifts.find(s=>s.tr===tr&&s.off===off);if(old)state.shifts.splice(state.shifts.indexOf(old),1);
const prev=shiftsOf(tr).filter(s=>s.off<off).pop();
const s={id:'s'+(++sid),tr,fto,shift:$('#asSh').value,off,n:99,week:prev?prev.week:1,reports:reps};
state.shifts.push(s);state.flashId=s.id;state.weekOff=Math.floor((dOf(off)-monday(0))/(7*DAY));
audit('Added shift · '+trOf(tr).name+' · '+f(off));toast('Shift added for '+trOf(tr).name);render();
const el=document.getElementById('a-grid');if(el)el.scrollIntoView({behavior:'smooth',block:'start'});});
const asSh=$('#asSh');if(asSh)asSh.addEventListener('change',()=>{const d=asSh.value==='Day';$('#asSt').value=d?'5:45 AM':'5:45 PM';$('#asEn').value=d?'5:45 PM':'5:45 AM';});
const dTr=$('#dTr');if(dTr)dTr.addEventListener('change',()=>{state.daily.tr=dTr.value;state.daily.shift=null;render();});
const dSh=$('#dSh');if(dSh)dSh.addEventListener('change',()=>{state.daily.shift=dSh.value;render();});
const df=$('#dorForm');if(df)df.addEventListener('submit',e=>{e.preventDefault();const s=state.shifts.find(x=>x.id===state.daily.shift);if(!s)return;
state.dors[s.id]={ratings:[...df.querySelectorAll('select[data-ci]')].map(x=>x.value),mins:[...df.querySelectorAll('input[data-mi]')].map(x=>x.value),narr:$('#dNarr').value,sig:{fto:{by:s.fto,at:nowStamp()},trainee:null,sup:null}};
audit('Submitted Daily Observation Report · '+trOf(s.tr).name);state.reportId=s.id;toast('DOR signed & submitted · now awaiting trainee and supervisor');state.view='report';render();window.scrollTo(0,0);});
const wTr=$('#wTr');if(wTr)wTr.addEventListener('change',()=>{state.weekly.tr=wTr.value;state.weekly.wk=null;render();});
const wWk=$('#wWk');if(wWk)wWk.addEventListener('change',()=>{state.weekly.wk=+wWk.value;render();});
const wf=$('#wkForm');if(wf)wf.addEventListener('submit',e=>{e.preventDefault();const txt=$('#wTxt').value.trim();if(!txt){toast('Write the evaluation first');return;}
const w=state.weekly;const end=shiftsOf(w.tr).filter(s=>s.week===w.wk&&s.reports.includes('Weekly'))[0];
state.weeklies=state.weeklies.filter(x=>!(x.tr===w.tr&&x.week===w.wk));
state.weeklies.push({tr:w.tr,week:w.wk,shiftId:end?end.id:null,text:txt,by:trOf(w.tr).fto,at:nowStamp()});audit('Submitted Weekly Evaluation · '+trOf(w.tr).name+' · Week '+w.wk);toast('Weekly evaluation signed & submitted');render();});
const ck=$('#ckTr');if(ck)ck.addEventListener('change',()=>{state.ckTr=ck.value;render();});
const ap=$('#addPerson');if(ap)ap.addEventListener('submit',e=>{e.preventDefault();const n=$('#pName').value.trim();if(!n){toast('Enter a name');return;}
state.roster.push([$('#pRole').value,$('#pRank').value,n,$('#pBadge').value,$('#pEmail').value]);audit('Added '+n+' to roster');toast(n+' added · they\'ll set a password on first sign-in');render();});
const csv=$('#csv');if(csv)csv.addEventListener('change',()=>{const fl=csv.files[0];if(!fl)return;const rd=new FileReader();rd.onload=()=>{const rows=String(rd.result).split(/\r?\n/).filter(Boolean).slice(1).map(l=>l.split(',').map(x=>x.trim()));let n=0;rows.forEach(r=>{if(r.length>=5){state.roster.push(r.slice(0,5));n++;}});audit('Imported roster CSV ('+n+')');toast('Imported '+n+' people');render();};rd.readAsText(fl);});
}

document.addEventListener('click',e=>{
if(e.target.id==='modal'){$('#modal').classList.remove('open');return;}
const b=e.target.closest('[data-go],[data-act],[data-report],[data-trainee],[data-complete],[data-sign],[data-ck],[data-week],[data-note]');if(!b)return;
const ds=b.dataset;
if(ds.go){if(ds.go==='schedule')state.weekOff=0;go(ds.go);return;}
if(ds.report){state.reportId=ds.report;go('report');return;}
if(ds.trainee){state.trView=ds.trainee;go('trainee');return;}
if(ds.week){state.weekOff=ds.week==='0'?0:state.weekOff+(+ds.week);state.flashId=null;render();return;}
if(ds.note){state.notes[+ds.note].open=false;audit('Resolved FTO note');toast('Note resolved');render();return;}
if(ds.complete){const[id,r]=ds.complete.split('|');const s=state.shifts.find(x=>x.id===id);
if(r==='DOR'){state.daily={tr:s.tr,shift:id};go('daily');}
else if(r==='Weekly'){state.weekly={tr:s.tr,wk:s.week};go('weekly');}
else{s.eop=true;audit('Completed End of Phase Report · '+trOf(s.tr).name);toast('End of Phase Report completed for '+trOf(s.tr).name);render();}
return;}
if(ds.sign){const[id,k]=ds.sign.split('|');const d=state.dors[id],s=state.shifts.find(x=>x.id===id);
d.sig[k]={by:k==='sup'?ME.name:k==='trainee'?trOf(s.tr).name:s.fto,at:nowStamp()};audit('Signed DOR as '+({fto:'FTO',trainee:'Trainee',sup:'FTO Supervisor'})[k]+' · '+trOf(s.tr).name);
toast(sigCount(d)===3?'Report fully signed and filed':'Signature recorded');render();return;}
if(ds.ck){const[tr,key,field]=ds.ck.split('|');const k=tr+'|'+key;const c=state.ck[k]||{tr:0,pf:0,stamp:''};
c[field]=(c[field]+1)%3;c.stamp='#204 '+new Date().toLocaleDateString('en-US',{month:'numeric',day:'numeric'});state.ck[k]=c;const y=window.scrollY;const open=[...document.querySelectorAll('details.sec')].map(d=>d.open);render();document.querySelectorAll('details.sec').forEach((d,i)=>d.open=open[i]);window.scrollTo(0,y);return;}
const a=ds.act;
if(a==='startTour')setStep(0);
else if(a==='next')setStep(Math.min(state.tourStep+1,TOUR.length-1));
else if(a==='prev')setStep(Math.max(state.tourStep-1,0));
else if(a==='hideTour'){state.tourOn=false;$('#tour').innerHTML=tourHtml();}
else if(a==='resumeTour')setStep(state.tourStep);
else if(a==='explore'){state.tourOn=false;go('dashboard');}
else if(a==='theme'){state.theme={dark:'light',light:'auto',auto:'dark'}[state.theme];render();}
else if(a==='signout'){state.tourOn=false;go('welcome');}
else if(a==='draft')toast('Draft saved');
else if(a==='pdf')toast('In the live app this downloads a PDF');
else if(a==='backup'){audit('Manual backup');toast('Backup complete');}
else if(a==='remind'){const miss=missingList();const byFto={};miss.forEach(m=>{const k=m.r==='End of Phase'?ME.name:m.s.fto;(byFto[k]=byFto[k]||[]).push(m);});
audit('Weekly reminder emails sent ('+Object.keys(byFto).length+' people)');
const first=Object.keys(byFto).find(k=>k!==ME.name)||Object.keys(byFto)[0];
modal(`<h3>Reminders sent to ${Object.keys(byFto).length} people</h3><p class="small muted">Here's the email ${esc(first||'')} gets:</p><div class="email"><div class="hd"><b>FTO Tracker</b> · Anytown PD<br>To: ${esc(first||'')}</div><b>You have ${byFto[first]?byFto[first].length:0} open item(s) in FTO Tracker</b><ul style="padding-left:18px;margin:8px 0">${(byFto[first]||[]).map(m=>`<li>${repName[m.r]} · ${trOf(m.s.tr).name} · shift ${f(m.s.off)}</li>`).join('')}</ul>Sign in to complete them.</div><div class="btns" style="margin-top:14px"><button class="btn primary" data-act="closeModal">Close</button></div>`);}
else if(a==='closeModal')$('#modal').classList.remove('open');
});
render();
})();
</script>
</body>
</html>
